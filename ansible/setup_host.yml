---
- name: Prepare Ubuntu host for Docker workloads
  hosts: managed
  become: true
  gather_facts: true

  vars:
    deployer_user: deployer
    docker_users:
      - student
      - deployer
    deployer_public_key: ""
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('20.04', '>=')
        fail_msg: >-
          This playbook targets Ubuntu 20.04 or newer. Detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.

    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  tasks:
    - name: Install packages required for Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install Docker repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: '0644'

    - name: Configure the official Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create deployer account
      ansible.builtin.user:
        name: "{{ deployer_user }}"
        shell: /bin/bash
        groups:
          - sudo
        append: true
        create_home: true
        password_lock: true
        state: present

    - name: Grant deployer passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ deployer_user }}"
        content: "{{ deployer_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'

    - name: Install deployer public key when supplied
      ansible.posix.authorized_key:
        user: "{{ deployer_user }}"
        key: "{{ deployer_public_key }}"
        state: present
        manage_dir: true
      when: deployer_public_key | length > 0

    - name: Add managed users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups:
          - docker
        append: true
        state: present
      loop: "{{ docker_users }}"

  handlers: []
